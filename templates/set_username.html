<!DOCTYPE html>
<html>
<head>
    <title>Set Username</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #1a1a1a;
            color: #e0e0e0;
        }
        h2 {
            color: #4CAF50;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 4px;
        }
        input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: #ff6b6b;
            margin: 10px 0;
            padding: 10px;
            background-color: #2a1a1a;
            border: 1px solid #ff6b6b;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Meshtastic Public Access Chat</h1>
    <h2>Set Your Username</h2>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <input type="text" name="username" placeholder="Enter username (2-20 chars)" required minlength="2" maxlength="20" autocomplete="off">
        <button type="submit">Join Chat</button>
    </form>
</body>
</html>
